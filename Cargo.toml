[workspace]
members = ["rust/crates/*"]
# Commands at the root build, check and test every crate, as with one crate.
default-members = [".", "rust/crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
ume-base = { path = "rust/crates/base" }
ume-authoring = { path = "rust/crates/authoring" }
ume-playerbake = { path = "rust/crates/playerbake" }
ume-compiler = { path = "rust/crates/compiler" }
ume-native = { path = "rust/crates/native" }
ume-runner = { path = "rust/crates/runner" }
ume-agentcontrol = { path = "rust/crates/agentcontrol" }
ume-remote = { path = "rust/crates/remote" }
ume-mcp = { path = "rust/crates/mcp" }
anyhow = "1"
base64 = "0.22"
regex = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
libc = "0.2"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
yaml-rust2 = "0.13"
tempfile = "3"
png = { version = "0.18.1", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
url = "2"
sha1 = "0.10"
lz4-sys = "1.11.1"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
cc = "1"

[package]
name = "unity-micro-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "unity_micro_editor"
path = "rust/src/lib.rs"

[[bin]]
name = "unity-micro-editor"
path = "rust/src/main.rs"

# One binary for every integration test: each binary of its own loads and
# links the library again, which a build after an edit of it paid eight times.
[[test]]
name = "integration"
path = "rust/tests/integration.rs"

[dependencies]
ume-base.workspace = true
ume-authoring.workspace = true
ume-playerbake.workspace = true
ume-compiler.workspace = true
ume-native.workspace = true
ume-runner.workspace = true
ume-agentcontrol.workspace = true
ume-remote.workspace = true
ume-mcp.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
sha2.workspace = true
tempfile.workspace = true
png.workspace = true
url.workspace = true

[dev-dependencies]
ume-agentcontrol = { workspace = true, features = ["testing"] }

# Line tables keep file and line in backtraces and test failures; full debug
# info made the library's metadata 400 MB, which every test binary loads.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


# An optimized build for iterating: what `release` makes, without the
# whole-crate LTO and single code generation unit that take minutes after an
# edit. `cargo build --profile fast` writes target/fast.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = "line-tables-only"
