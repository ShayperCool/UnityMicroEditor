[package]
name = "ume-agentcontrol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ume-base.workspace = true
ume-authoring.workspace = true
ume-playerbake.workspace = true
ume-compiler.workspace = true
ume-runner = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tempfile.workspace = true
png.workspace = true
url.workspace = true

[features]
# Exposes the controller's fixtures to the tests of other crates.
testing = ["dep:ume-runner", "ume-runner/testing", "ume-base/testing"]

[dev-dependencies]
ume-base = { workspace = true, features = ["testing"] }
ume-runner = { workspace = true, features = ["testing"] }
